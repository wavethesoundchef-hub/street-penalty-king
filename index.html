// Jersey colours for a faction (default: Nigeria-style green & white #9)
const lum = c => (0.299 * ((c >> 16) & 255) + 0.587 * ((c >> 8) & 255) + 0.114 * (c & 255)) / 255;
function kitOf(f) {
  if (!f) return { body: 0xf4f4f0, sleeve: 0x0b8f4d, trim: 0x0b8f4d, text: 0x0b8f4d, pattern: 'zig', stripe: 0x0b8f4d, name: 'NAIJA', num: '9' };
  const k = f.kit || {};
  const body = k.body ?? f.primary;
  return {
    body, sleeve: k.sleeve ?? body, trim: k.trim ?? f.secondary,
    text: k.text ?? (lum(body) > 0.6 ? CFG.C.ink : 0xffffff),
    pattern: k.pattern || 'none', stripe: k.stripe ?? f.secondary,
    name: f.shirt || f.name, num: f.num || '10',
  };
}

// Back of a jersey with name + number. Base size 160 x 140, centred on (0, 0).
function jerseyBack(scene, kit) {
  const { C } = CFG;
  const c = scene.add.container(0, 0);
  const g = scene.add.graphics();
  const body = [
    { x: -34, y: -70 }, { x: -60, y: -62 }, { x: -80, y: -30 }, { x: -66, y: -14 }, { x: -52, y: -28 },
    { x: -52, y: 70 }, { x: 52, y: 70 }, { x: 52, y: -28 }, { x: 66, y: -14 }, { x: 80, y: -30 },
    { x: 60, y: -62 }, { x: 34, y: -70 }, { x: 0, y: -64 },
  ];
  g.fillStyle(kit.body, 1); g.fillPoints(body, true);
  // sleeves
  g.fillStyle(kit.sleeve, 1);
  g.fillPoints([{ x: -52, y: -60 }, { x: -60, y: -62 }, { x: -80, y: -30 }, { x: -66, y: -14 }, { x: -52, y: -28 }], true);
  g.fillPoints([{ x: 52, y: -60 }, { x: 60, y: -62 }, { x: 80, y: -30 }, { x: 66, y: -14 }, { x: 52, y: -28 }], true);
  if (kit.pattern === 'stripes') {
    g.fillStyle(kit.stripe, 1);
    [-40, -12, 16].forEach(x => g.fillRect(x, -62, 14, 132));
  } else if (kit.pattern === 'zig') {
    g.fillStyle(kit.stripe, 1);
    const zig = [{ x: -52, y: -58 }];
    for (let i = 0; i <= 13; i++) zig.push({ x: -52 + i * 8, y: i % 2 ? -36 : -46 });
    zig.push({ x: 52, y: -58 }, { x: 34, y: -66 }, { x: -34, y: -66 });
    g.fillPoints(zig, true);
  }
  // collar + cuffs in the trim colour
  g.lineStyle(5, kit.trim, 1);
  g.beginPath(); g.moveTo(-34, -68); g.lineTo(0, -62); g.lineTo(34, -68); g.strokePath();
  g.lineBetween(-79, -29, -66, -15); g.lineBetween(79, -29, 66, -15);
  g.lineStyle(3, C.ink, 1); g.strokePoints(body, true);

  const name = txt(scene, 0, -26, kit.name, 15, kit.text).setOrigin(0.5);
  name.setScale(Math.min(1, 92 / name.width));
  const num = pop(scene, 0, 22, kit.num, 64, kit.text,
    kit.trim !== kit.body ? { stroke: hex(kit.trim), strokeThickness: 3 } : {}).setOrigin(0.5);
  num.setScale(Math.min(1, 96 / num.width));
  c.add([g, name, num]);
  return c;
}

// Saved choices (browser storage; silently session-only where storage is blocked)
const Store = {
  read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  write(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  get() { const v = this.read('spk.faction'); return FACTIONS[v] ? v : null; },
  set(v) { this.write('spk.faction', v); },
  getOpp() { const v = this.read('spk.opponent'); return FACTIONS[v] ? v : null; },
  setOpp(v) { this.write('spk.opponent', v); },
  getName() { return cleanName(this.read('spk.name') || ''); },
  setName(v) { this.write('spk.name', cleanName(v)); },
};

/* ---------- untrusted input (links + network) is always cleaned ---------- */
function cleanName(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9 _.-]/g, '').trim().slice(0, 12); }
function cleanResults(arr) {
  return Array.isArray(arr) ? arr.filter(r => r === 'goal' || r === 'save' || r === 'miss').slice(0, CFG.SHOTS) : [];
}
function askName(force = false) {
  let name = Store.getName();
  if (!name || force) {
    const v = window.prompt('Your name (your friends will see it):', name || '');
    if (v !== null && cleanName(v)) { name = cleanName(v); Store.setName(name); }
  }
  return name || 'PLAYER';
}
const goalsOf = results => results.filter(r => r === 'goal').length;
const hosted = () => /^https?:$/.test(location.protocol);
const gameUrl = () => `${location.origin}${location.pathname}`;

/* ---------- WhatsApp challenge links (no server: the result rides in the URL) ---------- */
const Challenge = {
  encode(o) {
    const s = JSON.stringify(o);
    return btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  },
  decode(s) {
    try {
      const o = JSON.parse(decodeURIComponent(escape(atob(String(s).replace(/-/g, '+').replace(/_/g, '/')))));
      const r = cleanResults(String(o.r || '').split('').map(c => ({ g: 'goal', s: 'save', m: 'miss' })[c]));
      if (!FACTIONS[o.f] || r.length !== CFG.SHOTS) return null;
      return { n: cleanName(o.n) || 'A FRIEND', f: o.f, r };
    } catch (e) { return null; }
  },
  link(name, faction, results) {
    if (!hosted()) return '';
    const r = results.map(x => x[0]).join('');
    return `${gameUrl()}?ch=${this.encode({ n: name, f: faction, r })}`;
  },
};

// Invite from the page URL (?room=CODE or ?ch=...), handed out once then cleared from the address bar
const Invite = {
  done: false,
  take() {
    if (this.done) return null;
    this.done = true;
    const p = new URLSearchParams(location.search);
    const code = (p.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    const ch = p.get('ch') ? Challenge.decode(p.get('ch')) : null;
    if (code || p.get('ch')) { try { history.replaceState(null, '', location.pathname); } catch (e) { /* ignore */ } }
    if (code) return { type: 'room', code };
    if (ch) return { type: 'challenge', ch };
    return null;
  },
};

/* ---------- Live matches: WebRTC data channel via PeerJS (public broker only introduces the two phones) ---------- */
const Net = {
  events: new Phaser.Events.EventEmitter(),
  peer: null, conn: null, role: null, code: null, opp: null,
  available() { return typeof Peer !== 'undefined'; },
  live() { return !!(this.conn && this.conn.open); },
  makeCode() {
    const abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
    let c = '';
    for (let i = 0; i < 5; i++) c += abc[Math.floor(Math.random() * abc.length)];
    return c;
  },
  host(onCode, onError) {
    this.leave();
    this.role = 'host';
    const code = this.makeCode();
    const peer = new Peer('spk-' + code, { debug: 0 });
    this.peer = peer;
    peer.on('open', () => { this.code = code; onCode(code); });
    peer.on('connection', conn => {
      if (this.conn) {   // room already has a guest
        conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); });
        return;
      }
      this.attach(conn);
    });
    peer.on('error', err => {
      if (err && err.type === 'unavailable-id' && this.peer === peer) this.host(onCode, onError);
      else if (this.peer === peer) onError(err);
    });
  },
  join(code, onError) {
    this.leave();
    this.role = 'guest';
    this.code = code;
    const peer = new Peer({ debug: 0 });
    this.peer = peer;
    peer.on('open', () => this.attach(peer.connect('spk-' + code, { reliable: true })));
    peer.on('error', err => { if (this.peer === peer) onError(err); });
  },
  attach(conn) {
    this.conn = conn;
    conn.on('open', () => this.events.emit('open'));
    conn.on('data', d => this.events.emit('data', d && typeof d === 'object' ? d : {}));
    conn.on('close', () => { if (this.conn === conn) this.events.emit('close'); });
    conn.on('error', () => { if (this.conn === conn) this.events.emit('close'); });
  },
  send(msg) { try { if (this.live()) this.conn.send(msg); } catch (e) { /* dropped */ } },
  leave() {
    const { conn, peer } = this;
    this.peer = this.conn = this.role = this.code = this.opp = null;
    try { if (conn) conn.close(); } catch (e) { /* ignore */ }
    try { if (peer) peer.destroy(); } catch (e) { /* ignore */ }
  },
};

// Draw a faction crest as a container (base size 60px, scaled to `size`)
function factionBadge(scene, x, y, f, size = 60) {
  const { C } = CFG;
  const c = scene.add.container(x, y);
  const g = scene.add.graphics();
  const shield = [
    { x: -28, y: -34 }, { x: 28, y: -34 }, { x: 30, y: -6 }, { x: 22, y: 18 },
    { x: 0, y: 36 }, { x: -22, y: 18 }, { x: -30, y: -6 },
  ];
  const shift = (pts, dx, dy) => pts.map(p => ({ x: p.x + dx, y: p.y + dy }));
  g.fillStyle(C.ink, 1); g.fillPoints(shift(shield, 3, 4), true);
  g.fillStyle(f.secondary, 1); g.fillPoints(shield, true);
  const items = [g];

  if (f.id === 'cr7') {
    g.fillStyle(f.primary, 1);
    g.fillPoints([{ x: -28, y: -34 }, { x: 0, y: -34 }, { x: 0, y: 36 }, { x: -22, y: 18 }, { x: -30, y: -6 }], true);
    items.push(pop(scene, 0, -2, 'CR7', 26, C.white, { stroke: hex(C.ink), strokeThickness: 5 }).setOrigin(0.5));
  } else if (f.id === 'messi') {
    g.fillStyle(f.primary, 1);
    g.fillRect(-19, -34, 10, 50); g.fillRect(9, -34, 10, 50);
    items.push(pop(scene, 0, -2, '10', 30, 0x1d3c78, { stroke: '#ffffff', strokeThickness: 5 }).setOrigin(0.5));
  } else if (f.id === 'wizkid') {
    const star = [];
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? 7 : 16;
      star.push({ x: Math.cos(a) * r, y: -8 + Math.sin(a) * r });
    }
    g.fillStyle(f.accent, 1); g.fillPoints(star, true);
    items.push(txt(scene, 0, 17, 'WFC', 11, f.accent).setOrigin(0.5));
  } else if (f.id === 'davido') {
    items.push(pop(scene, 0, -6, '30BG', 22, f.primary).setOrigin(0.5));
    items.push(txt(scene, 0, 17, '001', 10, C.white).setOrigin(0.5));
  } else {
    // generic crest: monogram over a colour band
    g.fillStyle(f.primary, 1); g.fillRect(-24, 8, 48, 6);
    items.push(pop(scene, 0, -8, f.mono, 26, f.accent).setOrigin(0.5));
  }
  g.lineStyle(4, f.id === 'messi' ? 0x1d3c78 : f.accent, 1); g.strokePoints(shield, true);
  g.lineStyle(1.5, C.ink, 1); g.strokePoints(shift(shield, 0, 0), true);
  c.add(items);
  c.setScale(size / 60);
  return c;
}

// Horizontal segmented progress tracker (HUD)
function drawTracker(g, x0, y, results, current, segW = 22, segH = 10, gap = 5) {
  const { C } = CFG;
  for (let i = 0; i < CFG.SHOTS; i++) {
    const x = x0 + i * (segW + gap), res = results[i];
    if (res) g.fillStyle(RESULT_COLOR[res], 1);
    else if (i === current) g.fillStyle(C.white, 0.9);
    else g.fillStyle(C.track, 1);
    g.fillRoundedRect(x, y, segW, segH, segH / 2);
  }
}

// Round result badges with icons (Game Over)
function drawBadges(g, cx, y, results, r = 16, gap = 42) {
  const { C } = CFG;
  const x0 = cx - (CFG.SHOTS - 1) * gap / 2;
  for (let i = 0; i < CFG.SHOTS; i++) {
    const x = x0 + i * gap, res = results[i];
    g.fillStyle(C.ink, 1); g.fillCircle(x + 2, y + 3, r);
    g.fillStyle(res ? RESULT_COLOR[res] : C.track, 1); g.fillCircle(x, y, r);
    g.lineStyle(2.5, C.ink, 1); g.strokeCircle(x, y, r);
    g.lineStyle(3.5, C.ink, 1);
    if (res === 'goal') {
      g.beginPath(); g.moveTo(x - 7, y); g.lineTo(x - 2, y + 6); g.lineTo(x + 8, y - 6); g.strokePath();
    } else if (res === 'miss') {
      g.lineBetween(x - 6, y - 6, x + 6, y + 6); g.lineBetween(x + 6, y - 6, x - 6, y + 6);
    } else if (res === 'save') {           // little glove/shield
      g.fillStyle(C.ink, 1);
      g.fillPoints([{ x: x - 7, y: y - 7 }, { x: x + 7, y: y - 7 }, { x: x + 7, y: y + 1 }, { x: x, y: y + 8 }, { x: x - 7, y: y + 1 }], true);
    }
  }
}

const Textures = {
  build(scene) {

        pts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r });
      }

    };
    g.fillStyle(dark); pent(64, 64, 18, -Math.PI / 2);

      const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
      g.lineBetween(64 + Math.cos(a) * 18, 64 + Math.sin(a) * 18, 64 + Math.cos(a) * 33, 64 + Math.sin(a) * 33);
      const b = a + Math.PI / 5;
      g.fillStyle(dark); pent(64 + Math.cos(b) * 45, 64 + Math.sin(b) * 45, 13, b);

    // --- soft radial blob (dust, light pools) ---

    for (let r = 64; r > 0; r -= 2) { g.fillStyle(0xffffff, 0.035); g.fillCircle(64, 64, r); }

  },
};

/* =====================================================================
   4. GOALKEEPER
   ===================================================================== */
class Keeper {
  constructor(scene) {
    const { GOAL, C } = CFG;
    this.scene = scene;
    this.baseY = GOAL.lineY + 2;
    this.center = (GOAL.left + GOAL.right) / 2;

    this.shadow = scene.add.ellipse(this.center, this.baseY, 64, 12, 0x000000, 0.5).setDepth(3.5);
    this.c = scene.add.container(this.center, this.baseY).setDepth(4);

    this.g = scene.add.graphics();
    this.num = pop(scene, 0, -64, '1', 18, C.white, { stroke: hex(C.ink), strokeThickness: 3 }).setOrigin(0.5);
    this.c.add([this.g, this.num]);
    this.drawKit();

    this.mode = 'patrol';
    this.phase = 0;
    this.configure(0);
  }

  // Streetwear keeper: jersey (kit colours), black trackpants with side stripes, white kicks,
  // orange gloves, red headband. Drawn with a bold outline for a sticker/comic look.
  drawKit(jersey = CFG.C.green, panel = 0xffffff) {
    const { C } = CFG;
    const g = this.g; g.clear();
    const ink = C.ink, skin = 0x5b3a22;
    const shape = (color, fn) => { g.fillStyle(color, 1); fn('fill'); g.lineStyle(2.5, ink, 1); fn('stroke'); };
    const rr = (x, y, w, h, r) => m => (m === 'fill' ? g.fillRoundedRect(x, y, w, h, r) : g.strokeRoundedRect(x, y, w, h, r));
    const circ = (x, y, r) => m => (m === 'fill' ? g.fillCircle(x, y, r) : g.strokeCircle(x, y, r));

    // arms (forearm skin + jersey sleeve)
    shape(skin, rr(-34, -110, 11, 26, 5)); shape(skin, rr(23, -110, 11, 26, 5));
    shape(jersey, rr(-35, -90, 13, 22, 5)); shape(jersey, rr(22, -90, 13, 22, 5));
    // legs: trackpants
    shape(0x17181d, rr(-15, -46, 13, 40, 4)); shape(0x17181d, rr(2, -46, 13, 40, 4));
    g.fillStyle(0xffffff, 0.9); g.fillRect(-14, -44, 2, 36); g.fillRect(12, -44, 2, 36);
    // sneakers
    shape(0xf4f4f4, rr(-19, -9, 17, 9, 3)); shape(0xf4f4f4, rr(2, -9, 17, 9, 3));
    g.fillStyle(C.red, 1); g.fillRect(-18, -3, 15, 2); g.fillRect(3, -3, 15, 2);
    // jersey torso
    shape(jersey, rr(-22, -90, 44, 50, 12));
    g.fillStyle(panel, 1);
    g.fillPoints([{ x: -9, y: -90 }, { x: 9, y: -90 }, { x: 0, y: -80 }], true);       // V collar
    g.fillRect(-22, -50, 44, 4);                                                    // hem band
    g.fillStyle(panel, 0.92); g.fillRect(-22, -74, 6, 22); g.fillRect(16, -74, 6, 22); // side panels
    // waistband
    shape(0x17181d, rr(-18, -48, 36, 8, 3));
    // head, hair, headband
    shape(skin, circ(0, -100, 11));
    g.fillStyle(0x120d09, 1); g.fillEllipse(0, -108, 22, 9);
    g.fillStyle(C.red, 1); g.fillRect(-11, -106, 22, 4);
    // gloves
    shape(0xff7a1a, circ(-28, -114, 9)); shape(0xff7a1a, circ(28, -114, 9));
    g.fillStyle(ink, 1); g.fillRect(-34, -110, 12, 2); g.fillRect(22, -110, 12, 2);
  }

  // Difficulty ramps up with each attempt
  configure(attempt) {
    this.amp = 92;
    this.speed = 1.7 + attempt * 0.35;
    this.reach = 24 + attempt * 6;
    this.reaction = 240 - attempt * 18;
    this.error = 62 - attempt * 7;
    this.wrongWay = 0.22 - attempt * 0.03;
    this.diveTime = 500 - attempt * 15;
  }

  update(dt) {
    if (this.mode === 'patrol') {
      this.phase += dt * 0.001 * this.speed;
      this.c.x = this.center + Math.sin(this.phase) * this.amp;
      this.c.y = this.baseY - Math.abs(Math.sin(this.phase * 2)) * 3;
    }
    this.shadow.x = this.c.x;
  }

  react(predX, predY) {
    this.scene.time.delayedCall(this.reaction, () => {
      if (this.mode === 'patrol') this.dive(predX, predY);
    });
  }

  dive(px, py) {
    const { GOAL } = CFG;
    const barY = GOAL.lineY - GOAL.height;
    this.mode = 'dive';
    // Ball clearly going off target: keeper just watches it
    if (px < GOAL.left - 40 || px > GOAL.right + 40 || py < barY - 30) return;

    const dx = px - this.c.x;
    const dir = Math.sign(dx) || 1;
    const height = this.baseY - py;
    const move = clamp(dx, -this.reach, this.reach);
    let rot, jump;
    if (Math.abs(dx) < 40) {
      rot = dir * 0.15;
      jump = clamp(height - 75, 0, 45);
    } else {
      const rem = Math.abs(dx) - Math.abs(move);
      rot = dir * clamp(Math.atan2(rem + 10, clamp(height, 10, 130)), 0.2, 1.25);
      jump = height > 90 ? 18 : 0;
    }
    this.scene.tweens.add({
      targets: this.c, x: this.c.x + move, y: this.baseY - jump, rotation: rot,
      duration: this.diveTime, ease: 'Cubic.easeOut',
    });
  }

  // Does the keeper's body/gloves overlap a ball at (x, y) with radius r?
  covers(x, y, r) {
    const c = this.c;
    const dx = x - c.x, dy = y - c.y;
    const cos = Math.cos(-c.rotation), sin = Math.sin(-c.rotation);
    const lx = dx * cos - dy * sin, ly = dx * sin + dy * cos;
    if (ly > 4 + r || ly < -124 - r) return false;
    const half = ly < -66 ? 38 : 22;   // arms + gloves are wider than the torso
    return Math.abs(lx) < half + r;
  }

  reset(attempt) {
    this.configure(attempt);
    this.scene.tweens.killTweensOf(this.c);
    this.mode = 'recover';
    this.scene.tweens.add({
      targets: this.c, rotation: 0, y: this.baseY,
      x: clamp(this.c.x, this.center - this.amp, this.center + this.amp),
      duration: 380, ease: 'Sine.easeInOut',
      onComplete: () => {
        this.phase = Math.asin(clamp((this.c.x - this.center) / this.amp, -1, 1));
        this.mode = 'patrol';
      },
    });
  }
}

    s.tweens.add({ targets: this.c, x: this.home.x + 14, angle: 5, duration: 110, ease: 'Quad.easeOut', yoyo: true, hold: 260 });
    s.tweens.add({ targets: this.head, y: 4, duration: 110, yoyo: true, hold: 260 });
  }

}

    }).setDepth(15);

      alpha: { start: 0.55, end: 0 }, gravityY: -30, tint: 0xa79d8c, emitting: false,
    }).setDepth(14);

    this.buildHud();
    this.buildHint();

    });

    // Play Again / rematch keep the same sides; first load and "Change faction" show the menu
    const m = this.registry.get('match');
    const skipMenu = this.registry.get('skipMenu');
    this.registry.set('skipMenu', false);
    if (skipMenu && m && FACTIONS[m.fid] && (m.mode !== 'live' || Net.live())) {
      this.startMatch(m.fid, m.oppId, m.mode, m.mode === 'live' ? { name: Net.opp && Net.opp.name } : m.extra);
    } else {
      this.state = 'menu';
      this.setHintVisible(false);
      this.scene.launch('Faction', { invite: Invite.take() });
    }
  }

  /* ---------- match setup: your side, any opponent, and the mode (solo | live | challenge) ---------- */
  startMatch(fid, oppId, mode = 'solo', extra = {}) {
    const f = FACTIONS[fid];
    const opp = FACTIONS[oppId] || FACTIONS[f.rival];
    this.faction = f;
    this.opp = opp;
    this.mode = mode;
    this.oppName = mode === 'solo' ? null : (cleanName(extra.name) || 'FRIEND');
    this.oppResults = mode === 'challenge' ? cleanResults(extra.results) : [];
    this.oppDone = mode === 'challenge';
    this.myDone = false;
    this.lastChant = null;
    this.registry.set('faction', fid);
    this.registry.set('match', { fid, oppId: opp.id, mode, extra });

    const ok = kitOf(opp);
    this.keeper.drawKit(ok.body, ok.trim);       // keeper wears the opponent's kit
    this.striker.setKit(kitOf(f));
    this.applyFactionHud();
    this.state = 'aim';
    this.setHintVisible(true);

    // kick-off banner
    const line = mode === 'live' ? `LIVE: YOU  VS  ${this.oppName}`
      : mode === 'challenge' ? `BEAT ${this.oppName}'S ${goalsOf(this.oppResults)}/${CFG.SHOTS}!`
      : `${f.name}  VS  ${opp.name} KEEPER`;
    const b = pop(this, 240, 470, line, 26, CFG.C.white, { stroke: hex(CFG.C.ink), strokeThickness: 6 })
      .setOrigin(0.5).setDepth(22).setAlpha(0);
    b.setScale(Math.min(1, 420 / b.width));
    this.tweens.add({ targets: b, alpha: 1, duration: 250 });
    this.tweens.add({ targets: b, alpha: 0, y: 450, delay: 1400, duration: 400, onComplete: () => b.destroy() });
  }

  applyFactionHud() {
    const { C } = CFG;
    const f = this.faction, opp = this.opp;
    const versus = this.mode === 'solo' ? `VS ${opp.name}` : `VS ${this.oppName} · ${opp.name}`;
    if (this.factionHud) this.factionHud.destroy();
    this.factionHud = this.add.container(0, 0).setDepth(31);
    const vs = txt(this, 412, this.mode === 'solo' ? 62 : 72, versus, 9, C.white).setOrigin(1, 0).setAlpha(0.75);
    vs.setScale(Math.min(1, 150 / vs.width));
    this.factionHud.add([
      factionBadge(this, 42, 45, f, 34),
      factionBadge(this, 438, 45, opp, 34),
      txt(this, 78, 62, f.name, 9, f.accent),
      vs,
    ]);
    this.avatarQ.setVisible(false);
    this.updateHud();
  }

  nextChant() {
    const list = this.faction ? this.faction.chants : ['GOAL!'];
    let c;
    do { c = Phaser.Utils.Array.GetRandom(list); } while (list.length > 1 && c === this.lastChant);
    this.lastChant = c;
    return c;
  }

  /* ---------- end of match + live opponent updates ---------- */
  endMatch() {
    if (this.mode === 'live') {
      this.myDone = true;
      Net.send({ t: 'done', r: this.results });
      if (this.oppDone || !Net.live()) { this.showResult(); return; }
      this.waitText = pop(this, 240, 470, `WAITING FOR ${this.oppName}…`, 28, CFG.C.white,
        { stroke: hex(CFG.C.ink), strokeThickness: 6 }).setOrigin(0.5).setDepth(22);
      this.tweens.add({ targets: this.waitText, alpha: 0.4, duration: 600, yoyo: true, repeat: -1 });
      return;
    }
    this.showResult();
  }

  showResult() {
    if (this.scene.isActive('Certificate')) return;
    if (this.waitText) { this.waitText.destroy(); this.waitText = null; }
    const data = { ...this.stats, results: [...this.results], faction: this.faction.id, opp: this.opp.id };
    if (this.mode !== 'solo') {
      data.duel = {
        mode: this.mode, name: this.oppName, faction: this.opp.id, results: [...this.oppResults],
        left: this.mode === 'live' && !this.oppDone,
      };
    }
    this.scene.launch('Certificate', data);
  }

  onNet(msg) {
    if (this.mode !== 'live' || !msg) return;
    if (msg.t === 'shot' && this.oppResults.length < CFG.SHOTS) {
      const r = cleanResults([msg.r])[0];
      if (!r) return;
      this.oppResults.push(r);
      this.updateHud();
      this.toast(`${this.oppName} ${r === 'goal' ? 'SCORED!' : r === 'save' ? 'GOT SAVED' : 'MISSED'}`);
    } else if (msg.t === 'done') {
      this.oppDone = true;
      this.oppResults = cleanResults(msg.r);
      this.updateHud();
      if (this.myDone) this.showResult();
    }
  }

  onNetClose() {
    if (this.mode !== 'live') return;
    this.toast(`${this.oppName} LEFT THE MATCH`);
    if (this.myDone) this.showResult();
  }

  // Rubber slipper (flip-flop) seen from above at a shallow angle
  slipper(g, x, y, color, angle) {
    const cos = Math.cos(angle), sin = Math.sin(angle);
    const rot = (dx, dy) => ({ x: x + dx * cos - dy * sin, y: y + dx * sin + dy * cos });
    const sole = [];
    for (let i = 0; i < 16; i++) {
      const a = i / 16 * Math.PI * 2;
      sole.push(rot(Math.cos(a) * 12 * (Math.cos(a) > 0 ? 1 : 0.85), Math.sin(a) * 4.5));
    }
    g.fillStyle(0x0b0d12, 0.5); g.fillPoints(sole.map(p => ({ x: p.x + 1, y: p.y + 2 })), true);
    g.fillStyle(color, 1); g.fillPoints(sole, true);
    g.lineStyle(1, 0x0b0d12, 0.8); g.strokePoints(sole, true);
    const a = rot(-7, 0), b = rot(1, -3.5), c = rot(1, 3.5);
    g.lineStyle(1.8, 0xffffff, 0.9); g.lineBetween(a.x, a.y, b.x, b.y); g.lineBetween(a.x, a.y, c.x, c.y);
  }

  drawNet() {
    const { GOAL, C } = CFG;
    const g = this.netG; g.clear();
    const barY = GOAL.lineY - GOAL.height;
    const bl = GOAL.left + GOAL.depth, br = GOAL.right - GOAL.depth;
    const bt = barY - 16, bb = GOAL.lineY - 24;
    const n = this.net;
    const off = (x, y) => n.v === 0 ? 0
      : -n.v * 16 * Math.exp(-((x - n.x) ** 2 + (y - n.y) ** 2) / (2 * 48 * 48));
    const sag = x => 3 * Math.sin(Math.PI * (x - bl) / (br - bl));   // tired, slightly sagging net

    g.fillStyle(0x000000, 0.3); g.fillRect(bl, bt, br - bl, bb - bt);
    g.lineStyle(1, C.chalk, 0.32);
    for (let x = bl; x <= br + 0.1; x += 14) {
      g.beginPath();
      for (let y = bt; y <= bb + 0.1; y += 8) {
        const yy = y + sag(x) + off(x, y);
        y === bt ? g.moveTo(x, yy) : g.lineTo(x, yy);
      }
      g.strokePath();
    }
    for (let y = bt; y <= bb + 0.1; y += 12) {
      g.beginPath();
      for (let x = bl; x <= br + 0.1; x += 8) {
        const yy = y + sag(x) + off(x, y);
        x === bl ? g.moveTo(x, yy) : g.lineTo(x, yy);
      }
      g.strokePath();
    }
    g.lineStyle(1, C.chalk, 0.22);
    for (let i = 0; i <= 20; i++) {
      const t = i / 20;
      g.lineBetween(lerp(GOAL.left, GOAL.right, t), barY, lerp(bl, br, t), bt);
    }
    for (let i = 0; i <= 10; i++) {
      const t = i / 10;
      g.lineBetween(GOAL.left, lerp(barY, GOAL.lineY, t), bl, lerp(bt, bb, t));
      g.lineBetween(GOAL.right, lerp(barY, GOAL.lineY, t), br, lerp(bt, bb, t));
    }
    // back frame: old rusty tubing
    g.lineStyle(3, C.rustDark, 1);
    g.strokeRect(bl, bt, br - bl, bb - bt);
    g.lineBetween(GOAL.left, GOAL.lineY, bl, bb);
    g.lineBetween(GOAL.right, GOAL.lineY, br, bb);
  }

  drawPosts(g) {
    const { GOAL, C } = CFG;
    const barY = GOAL.lineY - GOAL.height;
    const path = (ox = 0, oy = 0) => {
      g.beginPath();
      g.moveTo(GOAL.left + ox, GOAL.lineY); g.lineTo(GOAL.left + ox, barY + oy);
      g.lineTo(GOAL.right + ox, barY + oy); g.lineTo(GOAL.right + ox, GOAL.lineY);
      g.strokePath();
    };
    g.clear();
    // weathered white-painted steel frame
    g.lineStyle(10, 0x2b2b30, 1); path();
    g.lineStyle(6, 0xe6e2d6, 1); path();
    g.lineStyle(2, 0xb9b3a4, 1); path(1.5, 1.5);
    g.lineStyle(2, 0xffffff, 0.95); path(-1.5, -1.5);

    // rust showing through the paint
    const rng = new Phaser.Math.RandomDataGenerator(['rusty-goal']);
    const along = t => {   // 0..1 around the frame → point
      const L1 = GOAL.height, L2 = GOAL.right - GOAL.left, total = L1 * 2 + L2;
      let d = t * total;
      if (d < L1) return { x: GOAL.left, y: GOAL.lineY - d };
      d -= L1;
      if (d < L2) return { x: GOAL.left + d, y: barY };
      d -= L2;
      return { x: GOAL.right, y: barY + d };
    };
    for (let i = 0; i < 40; i++) {
      const p = along(rng.frac());
      g.fillStyle(rng.frac() < 0.6 ? C.rust : C.rustDark, 0.85);
      g.fillCircle(p.x + rng.between(-1, 1), p.y + rng.between(-1, 1), rng.realInRange(0.8, 2.2));
    }
    // rust streaks running down from the crossbar joints
    g.lineStyle(1.5, C.rust, 0.7);
    g.lineBetween(GOAL.left + 1, barY + 4, GOAL.left + 1, barY + 26);
    g.lineBetween(GOAL.right - 1, barY + 4, GOAL.right - 1, barY + 20);
    g.fillStyle(C.rustDark, 1);
    g.fillCircle(GOAL.left, barY, 4); g.fillCircle(GOAL.right, barY, 4);
  }

  shakePosts() {
    this.tweens.killTweensOf([this.postsG, this.netG]);
    this.postsG.x = 0; this.netG.x = 0;
    this.tweens.add({ targets: [this.postsG, this.netG], x: 3, duration: 40, yoyo: true, repeat: 5, onComplete: () => { this.postsG.x = 0; this.netG.x = 0; } });
  }

  rippleNet(x, y) {
    this.net.x = x; this.net.y = y;
    const t = { p: 0 };
    this.tweens.add({
      targets: t, p: 1, duration: 900,
      onUpdate: () => { this.net.v = (1 - t.p) * Math.cos(t.p * 22); this.drawNet(); },
      onComplete: () => { this.net.v = 0; this.drawNet(); },
    });
  }

  /* ---------- HUD ---------- */
  buildHud() {
    const { C } = CFG;
    const g = this.add.graphics().setDepth(30);
    // avatar rings: your faction (left) and the keeper's faction (right)
    [42, 438].forEach(x => {
      g.fillStyle(0x0b1a1c, 0.6); g.fillCircle(x, 44, 26);
      g.lineStyle(2, C.mint, 0.9); g.strokeCircle(x, 44, 26);
    });
    this.avatarQ = txt(this, 42, 44, '?', 18, C.mint).setOrigin(0.5).setDepth(31);

    // glass pills
    const pill = (x, w) => {
      const c = this.add.container(x + w / 2, 43).setDepth(30);
      const pg = this.add.graphics();
      pg.fillStyle(0x0b1a1c, 0.6); pg.fillRoundedRect(-w / 2, -13, w, 26, 13);
      pg.lineStyle(1.5, C.mint, 0.85); pg.strokeRoundedRect(-w / 2, -13, w, 26, 13);
      const t = txt(this, 0, 0, '', 12, C.white).setOrigin(0.5).setShadow(1, 1, '#000000', 0, true, true);
      c.add([pg, t]);
      return { c, t };
    };
    this.shotPill = pill(76, 94);
    this.scorePill = pill(178, 86);
    this.streakPill = pill(318, 94);
    this.lastStreak = 0;

    this.markG = this.add.graphics().setDepth(30);
    this.updateHud();
  }

  updateHud() {
    this.shotPill.t.setText(`SHOT: ${Math.min(this.attempt + 1, CFG.SHOTS)}/${CFG.SHOTS}`);
    this.scorePill.t.setText(`SCORE: ${this.stats.goals}`);
    let streak = 0;
    for (let i = this.results.length - 1; i >= 0 && this.results[i] === 'goal'; i--) streak++;
    this.streakPill.t.setText(streak ? `STREAK: \u{1F525}${streak > 1 ? '×' + streak : ''}` : 'STREAK: 0');
    if (streak > this.lastStreak) {
      this.tweens.add({ targets: this.streakPill.c, scale: 1.18, duration: 120, yoyo: true, ease: 'Quad.easeOut' });
    }
    this.lastStreak = streak;
    this.markG.clear();
    drawTracker(this.markG, 178, 62, this.results, this.attempt, 14, 5, 3);
    // friend's shots (live) or the challenger's shots, under the streak pill
    if (this.mode && this.mode !== 'solo') {
      drawTracker(this.markG, 328, 62, this.oppResults, this.mode === 'live' ? this.oppResults.length : -1, 14, 5, 3);
    }
  }

  /* ---------- power meter + aim arrow (display only: mirrors the flick maths, never feeds it) ---------- */
  buildHint() {
    const { C } = CFG;
    this.meterG = this.add.graphics().setDepth(26);
    this.aimG = this.add.graphics().setDepth(9);
    this.hintText = txt(this, 261, 734, 'SWIPE TO SHOOT', 12, C.white).setOrigin(0.5).setDepth(26)
      .setShadow(2, 2, '#000000', 0, true, true);
    this.tweens.add({ targets: this.hintText, alpha: 0.55, duration: 900, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' });
    this.power = 0;
    this.drawMeter();
  }

  setHintVisible(v) { this.hintText.setText(v ? 'SWIPE TO SHOOT' : 'POWER'); }

  // 0..1 power from flick speed; the red end is where shots start clearing the bar
  powerFrac(speed) { return clamp((speed - 0.35) / 2.4, 0, 1); }

  powerColor(t) {
    const stops = [0x2ecc71, 0xa3d93b, 0xf5d000, 0xff9a1f, 0xe63946];
    const s = clamp(t, 0, 1) * (stops.length - 1), i = Math.min(Math.floor(s), stops.length - 2);
    const A = Phaser.Display.Color.ValueToColor(stops[i]), B = Phaser.Display.Color.ValueToColor(stops[i + 1]);
    const c = Phaser.Display.Color.Interpolate.ColorWithColor(A, B, 100, (s - i) * 100);
    return Phaser.Display.Color.GetColor(c.r, c.g, c.b);
  }

  drawMeter() {
    const { C } = CFG;
    const g = this.meterG; g.clear();
    const x0 = 176, y0 = 748, w = 170, h = 14, n = 12, gap = 2, sw = (w - gap * (n - 1)) / n;
    g.fillStyle(0x0b1a1c, 0.65); g.fillRoundedRect(x0 - 6, y0 - 5, w + 12, h + 10, 9);
    g.lineStyle(1.5, C.mint, 0.6); g.strokeRoundedRect(x0 - 6, y0 - 5, w + 12, h + 10, 9);
    for (let i = 0; i < n; i++) {
      const lit = (i + 0.5) / n <= this.power;
      g.fillStyle(this.powerColor(i / (n - 1)), lit ? 1 : 0.2);
      g.fillRect(x0 + i * (sw + gap), y0, sw, h);
    }
    // sweeping arrow off the end of the meter
    const P0 = { x: x0 + w + 12, y: y0 + h - 2 }, P1 = { x: x0 + w + 58, y: y0 + h }, P2 = { x: x0 + w + 74, y: y0 - 34 };
    const q = t => ({ x: (1 - t) ** 2 * P0.x + 2 * (1 - t) * t * P1.x + t * t * P2.x, y: (1 - t) ** 2 * P0.y + 2 * (1 - t) * t * P1.y + t * t * P2.y });
    g.lineStyle(3, 0xffffff, 0.9);
    g.beginPath(); g.moveTo(P0.x, P0.y);
    for (let t = 0.1; t <= 1.001; t += 0.1) { const p = q(t); g.lineTo(p.x, p.y); }
    g.strokePath();
    const tip = q(1), prev = q(0.9), ang = Math.atan2(tip.y - prev.y, tip.x - prev.x);
    g.fillStyle(0xffffff, 0.95);
    g.fillTriangle(
      tip.x + Math.cos(ang) * 8, tip.y + Math.sin(ang) * 8,
      tip.x + Math.cos(ang + 2.4) * 8, tip.y + Math.sin(ang + 2.4) * 8,
      tip.x + Math.cos(ang - 2.4) * 8, tip.y + Math.sin(ang - 2.4) * 8);
  }

  // Live preview while dragging: same 130ms speed window the shot uses
  drawAim(pts) {
    const g = this.aimG; g.clear();
    if (pts.length < 2) return;
    const a = pts[0], b = pts[pts.length - 1];
    let k = pts.length - 1;
    while (k > 0 && b.t - pts[k - 1].t <= 130) k--;
    if (k === pts.length - 1) k--;
    const w = pts[k];
    this.power = this.powerFrac(Math.hypot(b.x - w.x, b.y - w.y) / Math.max(b.t - w.t, 16));
    this.drawMeter();
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
    if (dy > -10 || len < 10) return;
    const ux = dx / len, uy = dy / len, L = 40 + this.power * 80;
    const sx = CFG.SPOT.x, sy = CFG.SPOT.y - 24, ex = sx + ux * L, ey = sy + uy * L;
    const col = this.powerColor(this.power);
    g.lineStyle(9, 0x000000, 0.25); g.lineBetween(sx, sy, ex, ey);
    g.lineStyle(5, col, 0.95); g.lineBetween(sx, sy, ex, ey);
    const ang = Math.atan2(uy, ux);
    g.fillStyle(col, 1);
    g.fillTriangle(
      ex + Math.cos(ang) * 12, ey + Math.sin(ang) * 12,
      ex + Math.cos(ang + 2.5) * 11, ey + Math.sin(ang + 2.5) * 11,
      ex + Math.cos(ang - 2.5) * 11, ey + Math.sin(ang - 2.5) * 11);
  }

  toast(msg) {
    const t = txt(this, 240, 590, msg, 14, CFG.C.gold).setOrigin(0.5).setDepth(25).setShadow(2, 2, '#000000', 0, true, true);
    this.tweens.add({ targets: t, y: 570, alpha: 0, delay: 700, duration: 500, onComplete: () => t.destroy() });
  }

  // Comic-book burst pop-up with an optional pidgin caption tag
  popup(text, color, sub) {
    const { C } = CFG;
    const c = this.add.container(240, 470).setDepth(20);
    const t = pop(this, 0, 0, text, 64, C.white, { stroke: hex(C.ink), strokeThickness: 10 })
      .setOrigin(0.5).setShadow(5, 5, hex(C.ink), 0, true, true);
    t.setScale(Math.min(1, 380 / t.width));
    const rx = t.displayWidth / 2 + 36, ry = t.displayHeight / 2 + 28;
    const pts = [];
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * Math.PI * 2, k = i % 2 ? 0.8 : 1 + Math.random() * 0.12;
      pts.push({ x: Math.cos(a) * rx * k, y: Math.sin(a) * ry * k });
    }
    const b = this.add.graphics();
    b.fillStyle(C.ink, 1); b.fillPoints(pts.map(p => ({ x: p.x + 7, y: p.y + 7 })), true);
    b.fillStyle(color, 1); b.fillPoints(pts, true);
    b.lineStyle(4, C.ink, 1); b.strokePoints(pts, true);
    c.add([b, t]);
    c.setAngle(-5).setScale(0.2).setAlpha(0);
    this.tweens.add({ targets: c, scale: 1, alpha: 1, duration: 360, ease: 'Back.easeOut' });
    this.tweens.add({ targets: c, angle: -2, duration: 180, delay: 360, yoyo: true, repeat: 1 });
    this.tweens.add({ targets: c, y: 440, alpha: 0, delay: 1080, duration: 380, ease: 'Quad.easeIn', onComplete: () => c.destroy() });

    if (sub) {
      const s = this.add.container(240, 470 + ry + 20).setDepth(21).setAngle(3).setAlpha(0);
      const st = txt(this, 0, 0, sub, 15, C.white).setOrigin(0.5);
      const bg = this.add.graphics();
      bg.fillStyle(C.ink, 0.92); bg.fillRoundedRect(-st.width / 2 - 14, -16, st.width + 28, 32, 8);
      bg.fillStyle(color, 1); bg.fillRect(-st.width / 2 - 14, -16, 5, 32);
      s.add([bg, st]);
      this.tweens.add({ targets: s, alpha: 1, y: s.y - 6, delay: 180, duration: 260 });
      this.tweens.add({ targets: s, alpha: 0, delay: 1080, duration: 380, onComplete: () => s.destroy() });
    }
  }

  /* ---------- ball ---------- */
  placeBall(x, gy, lift, sc) {
    const size = CFG.BALL_SIZE * sc;
    this.ball.setDisplaySize(size, size).setPosition(x, gy - lift - size / 2);
    this.shadow.setPosition(x, gy).setDisplaySize(size * 0.95, size * 0.28)
      .setAlpha(clamp(0.55 - lift / 400, 0.1, 0.55));
  }

  resetBall() {
    const { SPOT } = CFG;
    this.state = 'aim';
    this.shot = null;
    this.tweens.killTweensOf(this.ball);
    this.ball.setDepth(8).setAlpha(1).setRotation(0);
    this.shadow.setAlpha(0.55);
    this.placeBall(SPOT.x, SPOT.y, 0, 1);
    const s = this.ball.scale;
    this.ball.setScale(0);
    this.tweens.add({ targets: this.ball, scale: s, duration: 360, ease: 'Back.easeOut' });
    this.keeper.reset(this.attempt);
    this.power = 0;
    this.drawMeter();
    this.aimG.clear();
    this.setHintVisible(true);
    this.updateHud();
  }

  /* ---------- input ---------- */
  worldPoint(p) {
    const w = this.cameras.main.getWorldPoint(p.x, p.y);
    return { x: w.x, y: w.y, t: performance.now() };
  }

  onDown(p) {
    if (this.state !== 'aim') return;
    const pt = this.worldPoint(p);
    if (pt.y < CFG.GOAL.lineY + 60) return;
    this.tweens.killTweensOf(this.swipeG);
    this.swipeG.setAlpha(1);
    this.swipe = { pts: [pt] };
    this.drawSwipe();
  }

  onMove(p) {
    if (!this.swipe) return;
    const pt = this.worldPoint(p);
    const last = this.swipe.pts[this.swipe.pts.length - 1];
    if (Math.hypot(pt.x - last.x, pt.y - last.y) < 3) { last.t = pt.t; return; }
    this.swipe.pts.push(pt);
    this.drawSwipe();
  }

  drawSwipe() {
    const g = this.swipeG, pts = this.swipe.pts;
    g.clear();
    if (pts.length < 2) return;
    [[9, 0x000000, 0.25], [4, CFG.C.chalk, 0.85]].forEach(([w, col, a]) => {
      g.lineStyle(w, col, a);
      g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
      for (let i = 1; i < pts.length; i++) g.lineTo(pts[i].x, pts[i].y);
      g.strokePath();
    });
    this.drawAim(pts);
  }

  onUp(p) {
    if (!this.swipe) return;
    const pts = this.swipe.pts;
    const end = this.worldPoint(p);
    const lastPt = pts[pts.length - 1];
    if (Math.hypot(end.x - lastPt.x, end.y - lastPt.y) >= 3) pts.push(end); else lastPt.t = Math.max(lastPt.t, end.t);
    this.swipe = null;
    this.tweens.add({ targets: this.swipeG, alpha: 0, duration: 260, onComplete: () => this.swipeG.clear() });
    this.aimG.clear();
    if (this.state !== 'aim' || pts.length < 2) return;

    const a = pts[0], b = pts[pts.length - 1];
    const dx = b.x - a.x, dy = b.y - a.y;
    if (dy > -35 || Math.hypot(dx, dy) < 45) { this.toast('FLICK UP TOWARD THE GOAL'); return; }

    // Flick speed: measured over the final ~130ms of the gesture
    let k = pts.length - 1;
    while (k > 0 && b.t - pts[k - 1].t <= 130) k--;
    if (k === pts.length - 1) k--;
    const w = pts[k];
    const speed = Math.hypot(b.x - w.x, b.y - w.y) / Math.max(b.t - w.t, 16);
    if (speed < 0.35) { this.toast('FLICK FASTER!'); return; }

    // Curve: biggest sideways bulge of the swipe away from the straight start→end line
    let dev = 0;
    for (const pt of pts) {
      const d = pt.x - (a.x + dx * (pt.y - a.y) / dy);
      if (Math.abs(d) > Math.abs(dev)) dev = d;
    }
    const curve = Math.abs(dev) < 6 ? 0 : clamp(-dev * 1.8, -120, 120);

    this.shoot(dx, dy, speed, curve);
  }

  /* ---------- shooting ---------- */
  shoot(dx, dy, speed, curve) {
    const { GOAL, SPOT, BALL_SIZE, FAR } = CFG;
    const aimX = SPOT.x + (dx / -dy) * (SPOT.y - GOAL.lineY) * 0.85;
    const lift = clamp((speed - 0.55) * 58, 0, 340);
    this.shot = {
      t0: this.time.now, D: clamp(1050 - speed * 190, 460, 980),
      sx: SPOT.x, sy: SPOT.y, aimX, curve, lift, arc: 12 + lift * 0.18, speed,
      spin: (0.18 + Math.abs(curve) / 400) * (Math.sign(curve || dx) || 1),
    };
    this.state = 'flight';
    this.setHintVisible(false);
    this.dust.explode(10, SPOT.x, SPOT.y);
    this.striker.kick();
    this.power = this.powerFrac(speed);
    this.drawMeter();

    // Keeper reads the shot (imperfectly; curve makes it harder)
    const k = this.keeper;
    const r = BALL_SIZE * FAR / 2;
    let predX = aimX + curve * 0.45 + randn() * (k.error + Math.abs(curve) * 0.35);
    const predY = GOAL.lineY - lift - r + randn() * 18;
    if (Math.random() < k.wrongWay) predX = k.c.x - (predX - k.c.x);
    k.react(predX, predY);
  }

  stepFlight() {
    const s = this.shot, { GOAL, FAR } = CFG;
    const p = clamp((this.time.now - s.t0) / s.D, 0, 1);
    const e = 1 - Math.pow(1 - p, 1.35);                 // perspective: slows as it travels away
    const gy = lerp(s.sy, GOAL.lineY, e);
    const x = lerp(s.sx, s.aimX, e) + s.curve * e * e;    // curve bends late, like real spin
    const lift = s.lift * e + s.arc * 4 * e * (1 - e);
    this.placeBall(x, gy, lift, lerp(1, FAR, e));
    this.ball.rotation += s.spin;
    if (p >= 1) this.resolve();
  }

  resolve() {
    const { GOAL } = CFG;
    const s = this.shot;
    const barY = GOAL.lineY - GOAL.height;
    const { x, y } = this.ball;
    const r = this.ball.displayWidth / 2;
    this.state = 'after';

    if (this.keeper.covers(x, y, r)) return this.onSave();
    if ((Math.abs(x - GOAL.left) <= r + 3 || Math.abs(x - GOAL.right) <= r + 3) && y > barY - r) return this.onWoodwork('post');
    if (Math.abs(y - barY) <= r + 3 && x > GOAL.left - r && x < GOAL.right + r) return this.onWoodwork('bar');
    if (x > GOAL.left && x < GOAL.right && y > barY) return this.onGoal();
    return this.onMiss(y < barY ? 'over' : 'wide');
  }

  onGoal() {
    const { GOAL, C } = CFG;
    const s = this.shot, b = this.ball;
    const barY = GOAL.lineY - GOAL.height;
    const nearPost = Math.min(b.x - GOAL.left, GOAL.right - b.x) < 50;
    // Headline = faction chant; caption = what kind of goal it was
    let sub = 'Na so! Back of the net';
    if (b.y < barY + 45 && nearPost) sub = 'Top corner! Where spider dey sleep';
    else if (Math.abs(s.curve) > 70) sub = 'Agba baller! See as e bend am';
    else if (b.y > GOAL.lineY - 30 && nearPost) sub = 'Bottom corner! Keeper no fit reach';
    else if (s.speed > 3.1) sub = `Gbosa! Thunder shot - ${Math.round(55 + s.speed * 24)} KM/H`;
    else if (s.speed < 1.1) sub = 'Shakara finish, cool and calm';

    this.stats.goals++;
    this.finish('goal');
    this.popup(this.nextChant(), this.faction ? this.faction.accent : C.green, sub);
    this.confetti.explode(70, b.x, b.y);
    this.rippleNet(b.x, b.y - 10);
    this.cameras.main.shake(200, 0.006);

    b.setDepth(3);
    this.tweens.add({ targets: this.shadow, alpha: 0, duration: 150 });
    const sc = b.scale * 0.85;
    this.tweens.add({
      targets: b, x: b.x + (240 - b.x) * 0.08, y: b.y - 18, scale: sc, duration: 180, ease: 'Quad.easeOut',
      onComplete: () => this.tweens.add({
        targets: b, y: GOAL.lineY - 24 - b.displayHeight / 2,
        duration: 420, ease: 'Bounce.easeOut',
      }),
    });
  }

  onSave() {
    const { C } = CFG;
    const b = this.ball;
    const side = Math.sign(b.x - this.keeper.c.x) || 1;
    this.stats.saved++;
    this.finish('save');
    this.popup('SAVED!', C.gold, 'Keeper don catch am!');
    this.dust.explode(14, b.x, b.y);
    this.cameras.main.shake(140, 0.004);
    this.tweens.add({ targets: this.shadow, alpha: 0, duration: 150 });
    this.tweens.add({
      targets: b, x: b.x + side * 130, y: b.y + 170, scale: b.scale * 1.8,
      rotation: b.rotation + side * 6, duration: 700, ease: 'Cubic.easeOut',
    });
    this.tweens.add({ targets: b, alpha: 0, delay: 500, duration: 300 });
  }

  onWoodwork(kind) {
    const { C } = CFG;
    const b = this.ball;
    this.stats.missed++;
    this.finish('miss');
    this.popup(kind === 'post' ? 'OFF THE POST!' : 'CROSSBAR!', C.red, 'E remain small!');
    this.dust.explode(16, b.x, b.y);
    this.shakePosts();
    this.cameras.main.shake(160, 0.005);
    this.tweens.add({ targets: this.shadow, alpha: 0, duration: 150 });
    const side = b.x < 240 ? -1 : 1;
    this.tweens.add({
      targets: b, x: b.x + (kind === 'post' ? side * 100 : side * 30), y: b.y + 150,
      scale: b.scale * 1.7, rotation: b.rotation - side * 5, duration: 650, ease: 'Cubic.easeOut',
    });
    this.tweens.add({ targets: b, alpha: 0, delay: 450, duration: 300 });
  }

  onMiss(kind) {
    const { C } = CFG;
    const s = this.shot, b = this.ball;
    this.stats.missed++;
    this.finish('miss');
    this.popup(kind === 'over' ? 'OVER THE BAR!' : 'WIDE!', C.red, kind === 'over' ? 'Na sky you dey aim?' : 'Ah ah! Aim am well');
    this.tweens.add({ targets: this.shadow, alpha: 0, duration: 200 });
    this.tweens.add({
      targets: b, x: b.x + (b.x - s.sx) * 0.25 + s.curve * 0.3, y: b.y - 40,
      scale: b.scale * 0.75, alpha: 0, duration: 480, ease: 'Quad.easeOut',
    });
  }

  finish(result) {
    this.results.push(result);
    this.attempt++;
    this.updateHud();
    if (this.mode === 'live') Net.send({ t: 'shot', r: result });
    this.time.delayedCall(1650, () => {
      if (this.attempt >= CFG.SHOTS) {
        this.state = 'over';
        this.endMatch();
      } else {
        this.resetBall();
      }
    });
  }

  /* ---------- trail: soft motion streak ---------- */
  drawTrail() {
    const g = this.trailG; g.clear();
    const n = this.trail.length;
    if (n < 2) return;
    for (let i = 1; i < n; i++) {
      const a = this.trail[i - 1], b = this.trail[i], t = i / (n - 1);
      g.lineStyle(Math.max(1, b.w * t * 1.6), 0xffffff, t * 0.12); g.lineBetween(a.x, a.y, b.x, b.y);
      g.lineStyle(Math.max(1, b.w * t * 0.6), 0xffffff, t * 0.45); g.lineBetween(a.x, a.y, b.x, b.y);
    }
  }

  update(time, delta) {
    this.keeper.update(delta);
    this.striker.update();

    if (this.state === 'flight') this.stepFlight();

    if (this.state === 'flight' || this.state === 'after') {
      this.trail.push({ x: this.ball.x, y: this.ball.y, w: this.ball.displayWidth / 2 });
    }
    if (this.trail.length > 26 || (this.state !== 'flight' && this.trail.length)) this.trail.shift();
    this.drawTrail();
  }
}

/* =====================================================================
   6. MENUS: shared button, Faction Selection, Match Certificate
   ===================================================================== */
// Chunky street-style button. Its hit zone is absolute, so don't move the button after creating it.
function makeButton(scene, x, y, w, h, label, fill, textColor, onClick, size = 24) {
  const { C } = CFG;
  const c = scene.add.container(x, y);
  const g = scene.add.graphics();
  const draw = col => {
    g.clear();
    g.fillStyle(C.ink, 1); g.fillRoundedRect(-w / 2 + 4, -h / 2 + 4, w, h, 12);
    g.fillStyle(col, 1); g.fillRoundedRect(-w / 2, -h / 2, w, h, 12);
    g.lineStyle(3, C.ink, 1); g.strokeRoundedRect(-w / 2, -h / 2, w, h, 12);
  };
  draw(fill);
  const t = pop(scene, 0, 0, label, size, textColor).setOrigin(0.5);
  t.setScale(Math.min(1, (w - 20) / t.width));
  c.add([g, t]);
  c.enabled = true;
  const zone = scene.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
  zone.on('pointerover', () => { if (c.enabled) scene.tweens.add({ targets: c, scale: 1.05, duration: 110 }); });
  zone.on('pointerout', () => scene.tweens.add({ targets: c, scale: 1, duration: 110 }));
  zone.on('pointerup', () => { if (c.enabled) onClick(); });
  c.setEnabled = on => {
    c.enabled = on;
    draw(on ? fill : C.track);
    t.setColor(hex(on ? textColor : C.muted));
    zone.input.cursor = on ? 'pointer' : 'default';
  };
  c.setLabel = s => { t.setText(s); t.setScale(1); t.setScale(Math.min(1, (w - 20) / t.width)); };
  c.remove = () => { zone.destroy(); c.destroy(); };
  return c;
}

// Frosted-glass overlay shared by the menus: blurs the street behind (WebGL) and draws the panel
function glassPanel(scene, title) {
  const { W, H, C } = CFG;
  const cam = scene.scene.get('Game').cameras.main;
  let blur = null;
  try { blur = cam.postFX ? cam.postFX.addBlur(0, 2, 2, 1.1) : null; } catch (e) { blur = null; }
  scene.events.once('shutdown', () => { try { if (blur) cam.postFX.remove(blur); } catch (e) { /* ignore */ } });

  const root = scene.add.container(0, 0).setAlpha(0);
  root.add(scene.add.rectangle(0, 0, W, H, 0x0a0f1a, 0.35).setOrigin(0));
  const g = scene.add.graphics();
  root.add(g);
  const X = 22, Y = 70, PW = 436, PH = 668;
  g.fillStyle(0x15263a, 0.58); g.fillRoundedRect(X, Y, PW, PH, 20);
  g.fillGradientStyle(0xffffff, 0xffffff, 0xffffff, 0xffffff, 0.14, 0.14, 0, 0); g.fillRect(X + 10, Y + 2, PW - 20, 60);
  g.lineStyle(1.5, 0xffffff, 0.35); g.strokeRoundedRect(X, Y, PW, PH, 20);
  glassBar(g, X + 14, 84, PW - 28, 44, 0.45, 0.25);
  const t = pop(scene, 240, 106, title, 24, C.white).setOrigin(0.5).setShadow(2, 2, '#000000', 0, true, true);
  t.setScale(Math.min(1, 392 / t.width));
  root.add(t);
  scene.tweens.add({ targets: root, alpha: 1, duration: 250 });
  return { root, g };
}

function glassBar(g, x, y, w, h, alpha = 0.4, border = 0.18) {
  g.fillStyle(0x0b1622, alpha); g.fillRoundedRect(x, y, w, h, h / 2.6);
  g.lineStyle(1, 0xffffff, border); g.strokeRoundedRect(x, y, w, h, h / 2.6);
}

function menuToast(scene, msg, y = 640) {
  const t = txt(scene, 240, y, msg, 12, CFG.C.gold).setOrigin(0.5).setDepth(50).setShadow(1, 1, '#000000', 0, true, true);
  scene.tweens.add({ targets: t, alpha: 0, y: y - 16, delay: 1400, duration: 400, onComplete: () => t.destroy() });
}

/* ---------------------------------------------------------------------
   Faction menu: step 1 pick your side, step 2 pick any opponent
   --------------------------------------------------------------------- */
class FactionScene extends Phaser.Scene {
  constructor() { super('Faction'); }

  init(data) { this.invite = (data && data.invite) || null; }

  create() {
    setupCamera(this);
    const { C } = CFG;
    this.side = Store.get() || (FACTIONS[this.registry.get('faction')] ? this.registry.get('faction') : null);
    const savedOpp = Store.getOpp();
    this.opp = savedOpp && savedOpp !== this.side ? savedOpp : (this.side ? FACTIONS[this.side].rival : null);
    this.step = 'side';
    this.buttons = [];

    const { root, g } = glassPanel(this, 'GOAT SUPREMACY: LAGOS STREETS');
    this.root = root;
    glassBar(g, 52, 136, 376, 30, 0.35);
    this.stepText = txt(this, 240, 151, '', 13, C.mint).setOrigin(0.5);
    root.add(this.stepText);

    this.tab = Math.max(0, this.tabOf(this.side));
    this.tabG = this.add.graphics();
    root.add(this.tabG);
    this.tabTexts = TABS.map((t, i) => {
      const x = 36 + i * 138, w = 132;
      const label = txt(this, x + w / 2, 194, t.label, 12, C.white).setOrigin(0.5);
      root.add(label);
      const zone = this.add.zone(x + w / 2, 194, w, 32).setInteractive({ useHandCursor: true });
      zone.on('pointerup', () => { if (this.tab !== i) { this.tab = i; this.buildList(); this.refresh(); } });
      return { label, x, w };
    });

    this.list = this.add.container(0, 0);
    this.detail = this.add.container(0, 0);
    root.add([this.list, this.detail]);
    this.listZones = [];
    root.add(txt(this, 240, 722, 'Fan-made game. Not affiliated with or endorsed by any player, artist or club.', 9, C.white,
      { align: 'center', wordWrap: { width: 380 } }).setOrigin(0.5).setAlpha(0.6));

    this.buildList();
    this.setStep('side');
    this.input.keyboard?.on('keydown-ENTER', () => this.primary && this.primary());
  }

  tabOf(id) { return TABS.findIndex(t => t.sections.some(s => s.rows.some(r => r.includes(id)))); }

  setStep(step) {
    this.step = step;
    const inv = this.invite;
    if (step === 'side') {
      this.stepText.setText(
        inv && inv.type === 'room' ? `JOINING ROOM ${inv.code}: PICK YOUR SIDE`
          : inv && inv.type === 'challenge' ? `${inv.ch.n} SCORED ${goalsOf(inv.ch.r)}/${CFG.SHOTS}: PICK YOUR SIDE`
          : 'STEP 1: PICK YOUR SIDE');
    } else {
      this.stepText.setText('STEP 2: PICK YOUR OPPONENT');
      const t = this.tabOf(this.opp);
      if (t >= 0 && t !== this.tab) { this.tab = t; this.buildList(); }
    }
    this.stepText.setScale(Math.min(1, 360 / this.stepText.width));
    this.detailFor = null;
    this.buildButtons();
    this.refresh();
  }

  buildButtons() {
    const { C } = CFG;
    this.buttons.forEach(b => b.remove());
    this.buttons = [];
    const add = (x, w, label, fill, text, fn, size = 20) => {
      const b = makeButton(this, x, 676, w, 50, label, fill, text, fn, size);
      this.root.add(b);
      this.buttons.push(b);
      return b;
    };
    const inv = this.invite;
    if (this.step === 'side' && inv && inv.type === 'room') {
      add(240, 280, 'JOIN THE MATCH', C.gold, C.ink, () => this.joinRoom());
      this.primary = () => this.joinRoom();
    } else if (this.step === 'side' && inv && inv.type === 'challenge') {
      add(240, 280, 'ACCEPT CHALLENGE', C.gold, C.ink, () => this.acceptChallenge());
      this.primary = () => this.acceptChallenge();
    } else if (this.step === 'side') {
      add(130, 196, 'PLAY A FRIEND', C.mint, C.ink, () => this.playFriend());
      add(350, 196, 'PICK OPPONENT ›', C.gold, C.ink, () => this.side && this.setStep('opponent'));
      this.primary = () => this.side && this.setStep('opponent');
    } else {
      add(130, 196, '‹ BACK', C.track, C.white, () => this.setStep('side'));
      add(350, 196, 'KICK OFF', C.gold, C.ink, () => this.kickOff(), 24);
      this.primary = () => this.kickOff();
    }
  }

  // (Re)build the section headers + matchup rows for the active tab
  buildList() {
    const { C } = CFG;
    this.list.removeAll(true);
    this.listZones.forEach(z => z.destroy());
    this.listZones = [];
    this.chips = {};
    this.rows = [];
    const g = this.add.graphics();
    this.list.add(g);
    let y = 222;
    TABS[this.tab].sections.forEach(sec => {
      glassBar(g, 36, y, 408, 26, 0.4);
      this.list.add(txt(this, 240, y + 13, `[${sec.title}]`, 12, C.mint).setOrigin(0.5));
      y += 32;
      sec.rows.forEach(ids => { this.makeRow(36, y, 408, 34, ids); y += 40; });
      y += 6;
    });
  }

  makeRow(x, y, w, h, ids) {
    const { C } = CFG;
    const rowG = this.add.graphics();
    this.list.add(rowG);
    let size = 13, labels, vsW, total;
    for (;;) {
      labels = ids.map(id => txt(this, 0, 0, FACTIONS[id].chip || FACTIONS[id].name, size, C.white).setOrigin(0.5));
      const probe = txt(this, 0, 0, 'vs', size - 1, C.white);
      vsW = probe.width + 14; probe.destroy();
      total = labels.reduce((s, t) => s + t.width + 20, 0) + vsW * (ids.length - 1);
      if (total > w - 12 && size > 10) { labels.forEach(t => t.destroy()); size--; } else break;
    }
    let cx = x + (w - total) / 2;
    ids.forEach((id, i) => {
      const t = labels[i], cw = t.width + 20;
      const chipG = this.add.graphics();
      t.setPosition(cx + cw / 2, y + h / 2);
      this.list.add([chipG, t]);
      const zone = this.add.zone(cx + cw / 2, y + h / 2, cw, h).setInteractive({ useHandCursor: true });
      zone.on('pointerover', () => { this.hover = id; this.refresh(); });
      zone.on('pointerout', () => { if (this.hover === id) this.hover = null; this.refresh(); });
      zone.on('pointerup', () => this.pick(id));
      this.listZones.push(zone);
      this.chips[id] = { g: chipG, t, x: cx, y: y + 4, w: cw, h: h - 8 };
      cx += cw;
      if (i < ids.length - 1) {
        this.list.add(txt(this, cx + vsW / 2, y + h / 2, 'vs', size - 1, C.white).setOrigin(0.5).setAlpha(0.55));
        cx += vsW;
      }
    });
    this.rows.push({ g: rowG, x, y, w, h, ids });
  }

  pick(id) {
    if (this.step === 'side') {
      this.side = id;
      if (this.opp === id || !this.opp) this.opp = FACTIONS[id].rival;
    } else {
      if (id === this.side) { menuToast(this, "THAT'S YOUR SIDE: PICK SOMEONE ELSE", 548); return; }
      this.opp = id;
    }
    this.refresh();
  }

  refresh() {
    const { C } = CFG;
    const target = this.step === 'side' ? this.side : this.opp;
    this.tabG.clear();
    this.tabTexts.forEach((t, i) => {
      const on = i === this.tab;
      this.tabG.fillStyle(on ? C.mint : 0x0b1622, on ? 0.95 : 0.45); this.tabG.fillRoundedRect(t.x, 178, t.w, 32, 12);
      this.tabG.lineStyle(1, 0xffffff, on ? 0 : 0.2); this.tabG.strokeRoundedRect(t.x, 178, t.w, 32, 12);
      t.label.setColor(hex(on ? C.ink : C.white));
    });
    this.rows.forEach(r => {
      const on = r.ids.includes(target);
      r.g.clear();
      r.g.fillStyle(0x0b1622, on ? 0.6 : 0.4); r.g.fillRoundedRect(r.x, r.y, r.w, r.h, 12);
      r.g.lineStyle(on ? 2 : 1, on ? C.mint : 0xffffff, on ? 0.95 : 0.15); r.g.strokeRoundedRect(r.x, r.y, r.w, r.h, 12);
    });
    for (const id in this.chips) {
      const ch = this.chips[id], f = FACTIONS[id];
      const sel = id === target, hov = id === this.hover;
      const mine = this.step === 'opponent' && id === this.side;
      ch.g.clear();
      if (sel) {
        ch.g.fillStyle(f.accent, 1); ch.g.fillRoundedRect(ch.x + 2, ch.y, ch.w - 4, ch.h, ch.h / 2);
      } else if (mine) {
        ch.g.lineStyle(1.5, C.mint, 0.9); ch.g.strokeRoundedRect(ch.x + 2, ch.y, ch.w - 4, ch.h, ch.h / 2);
      } else if (hov) {
        ch.g.lineStyle(1.5, f.accent, 0.9); ch.g.strokeRoundedRect(ch.x + 2, ch.y, ch.w - 4, ch.h, ch.h / 2);
      }
      ch.t.setColor(hex(sel ? (lum(f.accent) > 0.55 ? C.ink : C.white) : mine ? C.mint : C.white));
    }
    this.buttons.forEach(b => b.setEnabled(this.step === 'side' ? !!this.side : !!(this.side && this.opp)));

    // details (rebuilt only when the pick changes)
    const key = `${this.step}:${this.side}:${this.opp}`;
    if (this.detailFor === key) return;
    this.detailFor = key;
    this.detail.removeAll(true);
    const f = FACTIONS[this.side], o = FACTIONS[this.opp];
    if (!f) {
      this.detail.add(txt(this, 240, 604, 'TAP A NAME TO PICK YOUR SIDE', 12, C.white).setOrigin(0.5).setAlpha(0.7));
      return;
    }
    if (this.step === 'side') {
      const shirt = jerseyBack(this, kitOf(f)).setPosition(84, 604).setScale(0.5);
      this.detail.add([
        shirt,
        pop(this, 136, 578, f.name, 22, f.accent).setOrigin(0, 0.5),
        txt(this, 136, 600, f.tagline, 10, C.white).setOrigin(0, 0.5).setAlpha(0.75),
        txt(this, 136, 618, `YOUR JERSEY: ${kitOf(f).name} #${kitOf(f).num}`, 10, C.white).setOrigin(0, 0.5),
      ]);
      this.tweens.add({ targets: shirt, scale: { from: 0.42, to: 0.5 }, duration: 160, ease: 'Back.easeOut' });
    } else {
      const mineShirt = jerseyBack(this, kitOf(f)).setPosition(70, 604).setScale(0.4);
      const theirShirt = jerseyBack(this, kitOf(o)).setPosition(182, 604).setScale(0.4);
      this.detail.add([
        mineShirt, theirShirt,
        pop(this, 126, 604, 'VS', 20, C.white).setOrigin(0.5),
        txt(this, 230, 578, 'OPPONENT', 9, C.white).setOrigin(0, 0.5).setAlpha(0.7),
        pop(this, 230, 598, o.name, 20, o.accent).setOrigin(0, 0.5),
        txt(this, 230, 620, 'THEIR KEEPER WEARS THIS KIT', 9, C.mint).setOrigin(0, 0.5),
      ]);
      this.tweens.add({ targets: theirShirt, scale: { from: 0.34, to: 0.4 }, duration: 160, ease: 'Back.easeOut' });
    }
  }

  kickOff() {
    if (!this.side || !this.opp) return;
    Store.set(this.side); Store.setOpp(this.opp);
    this.scene.get('Game').startMatch(this.side, this.opp, 'solo');
    this.scene.stop();
  }

  playFriend() {
    if (!this.side) return;
    Store.set(this.side);
    this.scene.start('Lobby', { side: this.side });
  }

  joinRoom() {
    if (!this.side) return;
    Store.set(this.side);
    this.scene.start('Lobby', { side: this.side, join: this.invite.code });
  }

  acceptChallenge() {
    if (!this.side) return;
    Store.set(this.side);
    const ch = this.invite.ch;
    this.scene.get('Game').startMatch(this.side, ch.f, 'challenge', { name: ch.n, results: ch.r });
    this.scene.stop();
  }
}

/* ---------------------------------------------------------------------
   Play a Friend: live room (same Wi-Fi or online) or WhatsApp challenge
   --------------------------------------------------------------------- */
class LobbyScene extends Phaser.Scene {
  constructor() { super('Lobby'); }

  init(data) { this.side = data.side; this.joinCode = data.join || null; }

  create() {
    setupCamera(this);
    const { C } = CFG;
    const { root } = glassPanel(this, 'PLAY A FRIEND');
    this.root = root;
    this.name = askName();
    this.nameText = txt(this, 240, 151, '', 12, C.mint).setOrigin(0.5);
    root.add(this.nameText);
    this.setNameText();
    const nz = this.add.zone(240, 151, 300, 28).setInteractive({ useHandCursor: true });
    nz.on('pointerup', () => { this.name = askName(true); this.setNameText(); });

    this.view = this.add.container(0, 0);
    root.add(this.view);
    this.viewButtons = [];

    Net.events.on('open', this.onOpen, this);
    Net.events.on('data', this.onData, this);
    Net.events.on('close', this.onClose, this);
    this.events.once('shutdown', () => {
      Net.events.off('open', this.onOpen, this);
      Net.events.off('data', this.onData, this);
      Net.events.off('close', this.onClose, this);
    });

    if (this.joinCode) this.join(this.joinCode); else this.showMenu();
  }

  setNameText() { this.nameText.setText(`PLAYING AS ${this.name}  ·  TAP TO CHANGE`); }

  clearView() {
    this.view.removeAll(true);
    this.viewButtons.forEach(b => b.remove());
    this.viewButtons = [];
    if (this.dots) { this.dots.remove(); this.dots = null; }
  }

  button(x, y, w, label, fill, text, fn, size = 20, h = 48) {
    const b = makeButton(this, x, y, w, h, label, fill, text, fn, size);
    this.view.add(b);
    this.viewButtons.push(b);
    return b;
  }

  card(y, h, title, body) {
    const { C } = CFG;
    const g = this.add.graphics();
    glassBar(g, 40, y, 400, h, 0.45, 0.2);
    this.view.add([
      g,
      pop(this, 60, y + 22, title, 22, C.white).setOrigin(0, 0.5),
      txt(this, 60, y + 44, body, 11, C.white, { wordWrap: { width: 360 }, lineSpacing: 3 }).setOrigin(0, 0).setAlpha(0.8),
    ]);
  }

  showMenu() {
    const { C } = CFG;
    this.clearView();
    Net.leave();
    this.card(182, 176, 'LIVE MATCH', 'Same Wi-Fi or anywhere online. You both take 5 shots at the same time and see each other\'s results live. Best score wins.');
    this.button(138, 318, 180, 'CREATE ROOM', C.gold, C.ink, () => this.create_room());
    this.button(342, 318, 180, 'JOIN WITH CODE', C.mint, C.ink, () => {
      const v = window.prompt('Enter the room code your friend gave you:');
      const code = String(v || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
      if (code) this.join(code);
    });
    this.card(376, 166, 'WHATSAPP CHALLENGE', 'Take your 5 shots now, then send the link on WhatsApp. Your friend opens it, plays the same challenge and tries to beat your score.');
    this.button(240, 502, 360, 'START CHALLENGE', 0x25d366, C.ink, () => this.startChallenge());
    this.view.add(txt(this, 240, 586, 'Bluetooth isn\'t available to web games, so phones can\'t pair over it directly. For friends nearby, use LIVE MATCH on the same Wi-Fi.', 10, C.white,
      { align: 'center', wordWrap: { width: 380 }, lineSpacing: 3 }).setOrigin(0.5).setAlpha(0.65));
    this.button(240, 676, 240, '‹ BACK', C.track, C.white, () => this.back());
  }

  status(msg, color = CFG.C.white) {
    this.statusText = txt(this, 240, 0, msg, 13, color, { align: 'center', wordWrap: { width: 380 } }).setOrigin(0.5);
    return this.statusText;
  }

  liveUnavailable() {
    if (Net.available()) return false;
    menuToast(this, 'LIVE PLAY COULD NOT LOAD: CHECK YOUR INTERNET', 620);
    return true;
  }

  create_room() {
    if (this.liveUnavailable()) return;
    const { C } = CFG;
    this.clearView();
    this.view.add(this.status('CREATING ROOM…').setY(300));
    this.button(240, 676, 240, 'CANCEL', C.track, C.white, () => this.showMenu());
    Net.host(code => this.showRoom(code), err => this.fail(err));
  }

  showRoom(code) {
    const { C } = CFG;
    this.clearView();
    const link = hosted() ? `${gameUrl()}?room=${code}` : '';
    this.view.add([
      txt(this, 240, 196, 'ROOM CODE', 11, C.white).setOrigin(0.5).setAlpha(0.7),
      pop(this, 240, 240, code, 60, C.mint).setOrigin(0.5).setShadow(3, 3, '#000000', 0, true, true),
    ]);
    const msg = `⚽ Join my STREET PENALTY KING live match!\nRoom code: ${code}${link ? `\n${link}` : ''}`;
    this.button(240, 318, 360, 'SHARE INVITE ON WHATSAPP', 0x25d366, C.ink,
      () => window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener'), 20);
    if (link) {
      this.button(240, 378, 360, 'COPY INVITE LINK', C.track, C.white, () => {
        try { navigator.clipboard.writeText(link).then(() => menuToast(this, 'LINK COPIED', 420)); } catch (e) { menuToast(this, link, 420); }
      }, 18);
    }
    this.view.add(this.status('WAITING FOR YOUR FRIEND TO JOIN').setY(452));
    this.pulse(this.statusText);
    this.view.add(txt(this, 240, 520, link
      ? 'Your friend opens the link, or opens the game and taps PLAY A FRIEND › JOIN WITH CODE.'
      : 'Your friend opens the game and taps PLAY A FRIEND › JOIN WITH CODE. (Invite links work once the game is hosted online.)',
    10, C.white, { align: 'center', wordWrap: { width: 370 }, lineSpacing: 3 }).setOrigin(0.5).setAlpha(0.7));
    this.button(240, 676, 240, 'CANCEL', C.track, C.white, () => this.showMenu());
  }

  join(code) {
    if (this.liveUnavailable()) { this.showMenu(); return; }
    const { C } = CFG;
    this.clearView();
    this.view.add(this.status(`CONNECTING TO ROOM ${code}…`).setY(300));
    this.pulse(this.statusText);
    this.button(240, 676, 240, 'CANCEL', C.track, C.white, () => this.showMenu());
    Net.join(code, err => this.fail(err));
  }

  pulse(target) {
    this.dots = this.tweens.add({ targets: target, alpha: 0.4, duration: 600, yoyo: true, repeat: -1 });
  }

  fail(err) {
    const { C } = CFG;
    const type = err && err.type;
    const msg = type === 'peer-unavailable' ? 'ROOM NOT FOUND. CHECK THE CODE, OR ASK YOUR FRIEND TO CREATE A NEW ROOM.'
      : type === 'network' || type === 'server-error' || type === 'socket-error' ? 'COULD NOT REACH THE MATCH SERVER. CHECK YOUR INTERNET AND TRY AGAIN.'
      : type === 'browser-incompatible' ? 'THIS BROWSER CAN\'T PLAY LIVE MATCHES. TRY CHROME OR SAFARI.'
      : 'SOMETHING WENT WRONG CONNECTING. TRY AGAIN.';
    Net.leave();
    this.clearView();
    this.view.add(this.status(msg, C.gold).setY(320));
    this.button(240, 676, 240, '‹ BACK', C.track, C.white, () => this.showMenu());
  }

  // guest: connection is up, introduce ourselves
  onOpen() { if (Net.role === 'guest') Net.send({ t: 'hello', name: this.name, faction: this.side }); }

  onData(msg) {
    if (msg.t === 'full') { this.fail({ type: 'full' }); this.statusText.setText('THAT ROOM ALREADY HAS TWO PLAYERS.'); return; }
    if (msg.t !== 'hello' || Net.opp) return;
    const faction = FACTIONS[msg.faction] ? msg.faction : null;
    if (!faction) return;
    Net.opp = { name: cleanName(msg.name) || 'FRIEND', faction };
    if (Net.role === 'host') Net.send({ t: 'hello', name: this.name, faction: this.side });
    const { C } = CFG;
    this.clearView();
    this.view.add([
      factionBadge(this, 240, 290, FACTIONS[faction], 70),
      this.status(`${Net.opp.name} (${FACTIONS[faction].name}) IS IN!\nKICKING OFF…`, C.mint).setY(380),
    ]);
    this.time.delayedCall(1300, () => this.startLive());
  }

  onClose() {
    if (this.scene.isActive()) this.fail({ type: 'closed' });
  }

  startLive() {
    if (!Net.live() || !Net.opp) { this.fail({ type: 'closed' }); return; }
    this.scene.get('Game').startMatch(this.side, Net.opp.faction, 'live', { name: Net.opp.name });
    this.scene.stop();
  }

  startChallenge() {
    Net.leave();
    const opp = Store.getOpp() && Store.getOpp() !== this.side ? Store.getOpp() : FACTIONS[this.side].rival;
    this.registry.set('shareChallenge', true);
    this.scene.get('Game').startMatch(this.side, opp, 'solo');
    this.scene.stop();
  }

  back() {
    Net.leave();
    this.scene.start('Faction');
  }
}

/* ---------------------------------------------------------------------
   Match certificate: solo score card, or head-to-head result (live / challenge)
   --------------------------------------------------------------------- */
class CertificateScene extends Phaser.Scene {
  constructor() { super('Certificate'); }

  create(data) {
    setupCamera(this);
    const { W, H, C } = CFG;
    const { goals = 0, results = [], faction, duel } = data;
    const f = FACTIONS[faction] || FACTIONS.cr7;
    this.data_ = data;
    this.f = f;
    this.duel = duel || null;

    const root = this.add.container(0, 0).setAlpha(0);
    this.root = root;
    root.add(this.add.rectangle(0, 0, W, H, 0x05060a, 0.85).setOrigin(0));
    const g = this.add.graphics();
    const X = 28, Y = 58, PW = 424, PH = 700;
    g.fillStyle(0x000000, 0.5); g.fillRoundedRect(X + 6, Y + 6, PW, PH, 18);
    g.fillStyle(0x14171d, 1); g.fillRoundedRect(X, Y, PW, PH, 18);
    g.lineStyle(3, f.accent, 1); g.strokeRoundedRect(X + 8, Y + 8, PW - 16, PH - 16, 12);
    g.lineStyle(1, f.accent, 0.45); g.strokeRoundedRect(X + 15, Y + 15, PW - 30, PH - 30, 8);
    g.fillStyle(f.accent, 1);
    [[X + 15, Y + 15], [X + PW - 15, Y + 15], [X + 15, Y + PH - 15], [X + PW - 15, Y + PH - 15]].forEach(([dx, dy]) =>
      g.fillPoints([{ x: dx, y: dy - 6 }, { x: dx + 6, y: dy }, { x: dx, y: dy + 6 }, { x: dx - 6, y: dy }], true));
    root.add(g);
    this.g = g;

    const date = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).toUpperCase();
    root.add([
      pop(this, 240, 106, duel ? (duel.mode === 'live' ? 'LIVE MATCH RESULT' : 'CHALLENGE RESULT') : 'MATCH CERTIFICATE', 34, C.white,
        { stroke: hex(C.ink), strokeThickness: 6 }).setOrigin(0.5).setShadow(4, 4, hex(C.ink), 0, true, true),
      txt(this, 240, 140, `STREET PENALTY KING  ·  ${date}`, 10, C.muted).setOrigin(0.5),
    ]);
    this.buttons = [];
    if (duel) this.buildDuel(goals, results); else this.buildSolo(goals, results);
    this.tweens.add({ targets: root, alpha: 1, duration: 300 });
    this.input.keyboard?.once('keydown-ENTER', () => this.restart(true));

    Net.events.on('data', this.onNet, this);
    Net.events.on('close', this.onNetClose, this);
    this.events.once('shutdown', () => { Net.events.off('data', this.onNet, this); Net.events.off('close', this.onNetClose, this); });
  }

  addButton(y, h, label, fill, text, fn, size = 22) {
    const b = makeButton(this, 240, y, 320, h, label, fill, text, fn, size);
    this.root.add(b);
    this.buttons.push(b);
    return b;
  }

  addLink(y, label, fn) {
    const { C } = CFG;
    const t = txt(this, 240, y, label, 11, C.muted).setOrigin(0.5);
    const ul = this.add.graphics();
    ul.lineStyle(1, C.muted, 1); ul.lineBetween(240 - t.width / 2, y + 9, 240 + t.width / 2, y + 9);
    this.root.add([t, ul]);
    const z = this.add.zone(240, y, t.width + 30, 28).setInteractive({ useHandCursor: true });
    z.on('pointerover', () => t.setColor('#ffffff'));
    z.on('pointerout', () => t.setColor(hex(C.muted)));
    z.on('pointerup', fn);
  }

  quote(y, h, text) {
    const { C } = CFG;
    this.g.fillStyle(C.ink, 1); this.g.fillRoundedRect(56, y, 368, h, 10);
    this.g.fillStyle(this.f.accent, 1); this.g.fillRect(56, y, 5, h);
    this.root.add(txt(this, 240, y + h / 2, `“${text}”`, 14, C.white, { align: 'center', wordWrap: { width: 330 }, lineSpacing: 4 }).setOrigin(0.5));
  }

  stamp(x, y, words, col) {
    const s = this.add.container(x, y).setAngle(-14).setAlpha(0).setScale(1.8);
    const sg = this.add.graphics();
    sg.lineStyle(3, col, 0.9); sg.strokeCircle(0, 0, 40);
    sg.lineStyle(1.5, col, 0.9); sg.strokeCircle(0, 0, 34);
    s.add([sg, pop(this, 0, 0, words, 13, col, { align: 'center', lineSpacing: -3 }).setOrigin(0.5)]);
    this.root.add(s);
    return s;
  }

  countUp(textObj, goals, fmt, onDone) {
    const counter = { v: 0 };
    this.tweens.add({
      targets: counter, v: goals, delay: 350, duration: 200 + goals * 120,
      onUpdate: () => textObj.setText(fmt(Math.round(counter.v))),
      onComplete: onDone,
    });
  }

  /* ---------- solo ---------- */
  buildSolo(goals, results) {
    const { C } = CFG;
    const f = this.f;
    this.verdict = Phaser.Utils.Array.GetRandom(VERDICTS[goals]).replace('{F}', f.name);
    const score = pop(this, 240, 370, `0/${CFG.SHOTS}`, 84, C.white, { stroke: hex(C.ink), strokeThickness: 8 })
      .setOrigin(0.5).setShadow(5, 5, hex(C.ink), 0, true, true);
    const badges = this.add.graphics();
    drawBadges(badges, 240, 438, results, 14, 38);
    this.root.add([
      txt(this, 240, 172, 'THIS CERTIFIES THAT A PLAYER FROM', 10, C.muted).setOrigin(0.5),
      factionBadge(this, 240, 224, f, 62),
      pop(this, 240, 286, f.name, 30, f.accent).setOrigin(0.5),
      txt(this, 240, 316, 'SCORED', 10, C.muted).setOrigin(0.5),
      score, badges,
    ]);
    this.quote(470, 94, this.verdict);
    const col = goals >= 3 ? C.green : C.red;
    const st = this.stamp(378, 356, goals === CFG.SHOTS ? 'STREET\nKING' : goals >= 3 ? 'CERTIFIED\nBALLER' : 'NEEDS\nPRACTICE', col);
    this.countUp(score, goals, v => `${v}/${CFG.SHOTS}`, () => this.thump(st));

    const challenge = this.registry.get('shareChallenge');
    this.addButton(604, 54, challenge ? 'SEND CHALLENGE ON WHATSAPP' : 'SHARE TO WHATSAPP', 0x25d366, C.ink, () => this.shareSolo(), 20);
    this.addButton(668, 48, 'PLAY AGAIN', C.gold, C.ink, () => this.restart(true));
    this.addLink(722, 'CHANGE FACTION / OPPONENT', () => this.restart(false));
  }

  shareSolo() {
    const { goals, results } = this.data_;
    const name = askName();
    const link = Challenge.link(name, this.f.id, results);
    const msg = `\u{1F3C6} STREET PENALTY KING \u{1F3C6}\n\n${name} scored ${goals}/${CFG.SHOTS} for ${this.f.name} ⚽\n"${this.verdict}"\n\n` +
      (link ? `Think say you fit beat am? Tap to take my challenge \u{1F447}\n${link}` : 'Think say you fit beat am? Take your 5 penalties and drop your certificate!');
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  }

  /* ---------- head-to-head ---------- */
  buildDuel(goals, results) {
    const { C } = CFG;
    const d = this.duel, f = this.f, o = FACTIONS[d.faction] || FACTIONS[f.rival];
    const theirs = goalsOf(d.results);
    const outcome = d.left ? 'left' : goals > theirs ? 'win' : goals < theirs ? 'lose' : 'draw';
    const me = Store.getName() || 'YOU';
    this.outcome = outcome;
    this.theirGoals = theirs;

    const left = txt(this, 130, 262, `${me}\n${f.name}`, 10, C.white, { align: 'center' }).setOrigin(0.5, 0);
    const right = txt(this, 350, 262, `${d.name}\n${o.name}`, 10, C.white, { align: 'center' }).setOrigin(0.5, 0);
    [left, right].forEach(t => t.setScale(Math.min(1, 130 / t.width)));
    const score = pop(this, 240, 222, `0 - ${theirs}`, 60, C.white, { stroke: hex(C.ink), strokeThickness: 7 })
      .setOrigin(0.5).setShadow(4, 4, hex(C.ink), 0, true, true);
    const headline = { win: ['YOU WIN!', C.green], lose: ['YOU LOSE', C.red], draw: ["IT'S A DRAW", C.gold], left: ['OPPONENT LEFT', C.muted] }[outcome];
    const rows = this.add.graphics();
    drawBadges(rows, 270, 362, results, 12, 32);
    drawBadges(rows, 270, 400, d.results, 12, 32);
    this.root.add([
      factionBadge(this, 130, 216, f, 52), factionBadge(this, 350, 216, o, 52),
      left, right, score,
      pop(this, 240, 318, headline[0], 34, headline[1], { stroke: hex(C.ink), strokeThickness: 6 }).setOrigin(0.5),
      rows,
      txt(this, 92, 362, me, 10, C.white).setOrigin(0.5).setScale(1),
      txt(this, 92, 400, d.name, 10, C.white).setOrigin(0.5),
    ]);
    this.countUp(score, goals, v => `${v} - ${theirs}`);

    this.verdict = outcome === 'left'
      ? `${d.name} left before the end. You finished with ${goals}/${CFG.SHOTS}.`
      : Phaser.Utils.Array.GetRandom(DUEL_VERDICTS[outcome]).replace('{OPP}', d.name);
    this.quote(436, 84, this.verdict);

    if (d.mode === 'live') {
      this.rematch = this.addButton(570, 54, 'REMATCH', C.gold, C.ink, () => this.askRematch());
      if (!Net.live()) this.rematch.setEnabled(false);
      this.addButton(634, 48, 'SHARE RESULT ON WHATSAPP', 0x25d366, C.ink, () => this.shareDuel(), 18);
      this.addLink(700, 'LEAVE MATCH', () => { Net.leave(); this.restart(false); });
    } else {
      this.addButton(570, 54, 'SEND YOUR REPLY ON WHATSAPP', 0x25d366, C.ink, () => this.shareDuel(), 18);
      this.addButton(634, 48, 'PLAY AGAIN', C.gold, C.ink, () => this.restart(true, 'solo'));
      this.addLink(700, 'CHANGE FACTION / OPPONENT', () => this.restart(false));
    }
  }

  shareDuel() {
    const { goals, results } = this.data_;
    const d = this.duel, me = askName();
    const line = { win: `I beat ${d.name} ${goals}-${this.theirGoals}`, lose: `${d.name} beat me ${this.theirGoals}-${goals}`,
      draw: `${d.name} and I drew ${goals}-${this.theirGoals}`, left: `I scored ${goals}/${CFG.SHOTS}` }[this.outcome];
    const link = Challenge.link(me, this.f.id, results);
    const msg = `\u{1F3C6} STREET PENALTY KING \u{1F3C6}\n\n${line} (${this.f.name}) ⚽\n"${this.verdict}"` +
      (link ? `\n\nYour turn \u{1F447}\n${link}` : '');
    window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank', 'noopener');
  }

  askRematch() {
    this.myRematch = true;
    Net.send({ t: 'rematch' });
    this.rematch.setLabel(`WAITING FOR ${this.duel.name}…`);
    this.rematch.setEnabled(false);
    if (this.theirRematch) this.goRematch();
  }

  goRematch() {
    const m = this.registry.get('match');
    this.registry.set('match', { ...m, mode: 'live' });
    this.registry.set('skipMenu', true);
    this.scene.start('Game');
  }

  onNet(msg) {
    if (!this.duel || this.duel.mode !== 'live' || !msg || msg.t !== 'rematch') return;
    this.theirRematch = true;
    if (this.myRematch) this.goRematch();
    else if (this.rematch) this.rematch.setLabel(`${this.duel.name} WANTS A REMATCH!`);
  }

  onNetClose() {
    if (this.rematch) { this.rematch.setLabel(`${this.duel.name} LEFT`); this.rematch.setEnabled(false); }
  }

  thump(st) {
    this.tweens.add({ targets: st, alpha: 0.95, scale: 1, duration: 220, ease: 'Quad.easeIn', onComplete: () => this.cameras.main.shake(120, 0.004) });
  }

  // keepFaction: play again with the same sides (solo unless a live rematch); otherwise back to the menu
  restart(keepFaction, mode) {
    const m = this.registry.get('match');
    if (keepFaction && m) this.registry.set('match', { ...m, mode: mode || (m.mode === 'live' ? 'solo' : m.mode === 'challenge' ? 'solo' : m.mode), extra: {} });
    if (m && m.mode === 'live') Net.leave();
    this.registry.set('shareChallenge', keepFaction ? this.registry.get('shareChallenge') : false);
    this.registry.set('skipMenu', keepFaction);
    this.scene.start('Game');
  }
}

/* =====================================================================
   7. BOOT
   ===================================================================== */
function boot() {
  window.game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: CFG.W * CFG.S,
    height: CFG.H * CFG.S,
    backgroundColor: '#0b0d12',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 1 },
    scene: [GameScene, FactionScene, LobbyScene, CertificateScene],
  });
}
const fontReady = document.fonts
  ? Promise.race([
      Promise.all([document.fonts.load('40px "Anton"'), document.fonts.load('900 20px "Montserrat"')]),
      new Promise(r => setTimeout(r, 1500)),
    ])
  : Promise.resolve();
fontReady.then(boot, boot);
</script>
</body>
</html>
